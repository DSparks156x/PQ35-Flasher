[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pq35-flasher"
version = "0.1.0"
description = "VAG PQ35 TP2/KWP flasher: shared protocols and per-controller families"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
include = ["flasher*"]
